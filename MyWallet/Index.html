<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محفظتي – إدارة الأموال والثروة</title>
<meta name="description" content="تطبيق شخصي محلي لإدارة الأموال والحسابات والميزانيات والادخار.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#f1f5f9; --sf:#ffffff; --s2:#f8fafc; --s3:#e2e8f0;
  --tx:#0f172a; --tx2:#334155; --mut:#64748b;
  --bd:#e2e8f0; --bd2:#cbd5e1;
  --pri:#0f766e; --pri2:#0d9488; --pri-soft:#ccfbf1;
  --on:#ffffff;
  --in:#059669; --in-soft:#d1fae5;
  --out:#dc2626; --out-soft:#fee2e2;
  --gold:#b45309; --gold-soft:#fef3c7;
  --warn:#d97706; --warn-soft:#fef3c7;
  --info:#2563eb; --info-soft:#dbeafe;
  --rad:16px; --rad-sm:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px -5px rgba(15,23,42,.1), 0 8px 10px -6px rgba(15,23,42,.05);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --sf:#1e293b; --s2:#334155; --s3:#475569;
    --tx:#f1f5f9; --tx2:#cbd5e1; --mut:#94a3b8;
    --bd:#334155; --bd2:#475569;
    --pri:#2dd4bf; --pri2:#14b8a6; --pri-soft:#134e4a;
    --on:#0f172a;
    --in:#4ade80; --in-soft:#14532d;
    --out:#f87171; --out-soft:#7f1d1d;
    --gold:#fbbf24; --gold-soft:#78350f;
    --warn:#fbbf24; --warn-soft:#78350f;
    --info:#60a5fa; --info-soft:#1e3a8a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --sf:#1e293b; --s2:#334155; --s3:#475569;
  --tx:#f1f5f9; --tx2:#cbd5e1; --mut:#94a3b8;
  --bd:#334155; --bd2:#475569;
  --pri:#2dd4bf; --pri2:#14b8a6; --pri-soft:#134e4a;
  --on:#0f172a;
  --in:#4ade80; --in-soft:#14532d;
  --out:#f87171; --out-soft:#7f1d1d;
  --gold:#fbbf24; --gold-soft:#78350f;
  --warn:#fbbf24; --warn-soft:#78350f;
  --info:#60a5fa; --info-soft:#1e3a8a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
#nav{position:sticky;top:0;align-self:start;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:4px;border-inline-end:1px solid var(--bd);background:var(--sf);z-index:10}
.brand{font-weight:800;font-size:22px;padding:2px 12px 16px;color:var(--pri);display:flex;align-items:center;gap:8px}
#nav .it{display:flex;align-items:center;gap:12px;justify-content:flex-start;background:none;color:var(--tx2);padding:11px 12px;font-weight:600;border:0;cursor:pointer;border-radius:var(--rad-sm);width:100%;text-align:start;font:inherit;transition:all .15s}
#nav .it:hover{background:var(--s2);color:var(--tx)}
#nav .it.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
#nav .add{margin-top:auto;justify-content:center;background:var(--pri);color:var(--on);border:0}
#nav .add:hover{background:var(--pri2)}
main{padding:24px clamp(14px,3vw,36px) 40px;max-width:1080px;width:100%;margin:auto}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.2px;color:var(--tx)}
h3{margin:0 0 12px;font-size:17px;color:var(--tx)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.pa{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rad);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#0f766e 0%,#115e59 100%);color:#fff;border:0;padding:22px;box-shadow:var(--shadow-lg)}
.hero .l{opacity:.85;font-size:13px}
.hero .big{font-size:36px;font-weight:800;line-height:1.2;margin:6px 0 16px;overflow-wrap:anywhere}
.hero .k{color:#ffffffcc}
.hero .g2>div>div:last-child{color:#fff}
.hero .hg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:stretch}
.hero .hg>div{background:rgba(255,255,255,.08);border-radius:12px;padding:12px;position:relative}
.hero .hg>div.hl{background:rgba(255,255,255,.18);outline:1px solid rgba(255,255,255,.35)}
.hero .hg .l{font-size:12px;display:flex;align-items:center;gap:4px}
.hero .hg .v{font-size:22px;font-weight:800;line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.hero .hg .v.neg{color:#fde68a}
.hero .hg .s{font-size:11px;opacity:.8;margin-top:4px}
@media(max-width:560px){.hero .hg{grid-template-columns:1fr;gap:8px}}
.g2,.g3,.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr);margin-bottom:14px}
.grid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.grid>.card{margin:0}
.k{font-size:12px;color:var(--mut);font-weight:600}
.n{font-size:18px;font-weight:700;color:var(--tx)}
.in{color:var(--in)}.out{color:var(--out)}.gold{color:var(--gold)}
.r{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer;min-height:56px;border-radius:var(--rad-sm);transition:background .15s}
.r:last-child{border:0}
.r:hover{background:var(--s2)}
.r .g{flex:1;min-width:0}
.r .g small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--s3);flex:none;font-size:18px}
.ic.in{background:var(--in-soft);color:var(--in)}
.ic.out{background:var(--out-soft);color:var(--out)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.dh{font-size:12px;font-weight:700;color:var(--mut);padding:12px 4px 4px;text-transform:uppercase;letter-spacing:.3px}
.dh small{font-weight:400;margin-inline-start:6px;color:var(--mut);opacity:.8}
button{font:inherit;border:0;border-radius:var(--rad-sm);padding:10px 14px;min-height:44px;background:var(--s2);color:var(--tx);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;border:1px solid var(--bd)}
button:hover{background:var(--s3)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;pointer-events:none}
button.p{background:var(--pri);color:var(--on);border-color:var(--pri)}
button.p:hover{background:var(--pri2);border-color:var(--pri2)}
button.d{background:var(--out-soft);color:var(--out);border-color:transparent}
button.d:hover{background:var(--out-soft);filter:brightness(.95)}
button.b{background:transparent;border:1px solid var(--bd);color:var(--tx)}
button.b:hover{background:var(--s2)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--rad-sm);background:var(--sf);color:var(--tx);min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
label{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin:14px 2px 6px}
[hidden]{display:none!important}
.seg,.chips{display:flex;gap:6px;margin-bottom:12px}
.chips{flex-wrap:wrap;margin:0}
.seg{background:var(--s2);padding:4px;border-radius:var(--rad-sm);border:1px solid var(--bd)}
.seg button{flex:1;background:transparent;border:0;color:var(--tx2);min-height:38px;padding:6px 10px}
.seg button.on{background:var(--sf);color:var(--pri);box-shadow:var(--shadow-sm);font-weight:700}
.chip{background:var(--s2);color:var(--tx2);min-height:36px;padding:6px 14px;border:1px solid var(--bd);border-radius:99px;font-size:13px}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
#fab{display:none;position:fixed;inset-inline-start:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:54px;border-radius:27px;padding:0 20px;background:var(--pri);color:var(--on);box-shadow:var(--shadow-lg);z-index:11;border:0}
#m{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);z-index:30;align-items:flex-end;justify-content:center;padding:0}
#m.on{display:flex}
.sh{background:var(--sf);width:100%;max-width:580px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.acts button{flex:1;min-width:120px}
.bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;direction:ltr;margin-top:12px}
.days b{flex:1;background:var(--pri);border-radius:3px 3px 0 0;min-height:2px}
.pair{display:flex;align-items:flex-end;gap:3px;flex:1;height:100%;justify-content:center}
.pair b{width:36%;border-radius:3px 3px 0 0;min-height:2px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px;gap:8px}
.mn button{width:44px;padding:0;min-height:40px}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dn ul{list-style:none;margin:0;padding:0;flex:1;min-width:170px}
.dn li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:13px}
.dn li i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:6px}
.wb{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--rad-sm);padding:12px;margin-top:12px;font-size:13px;color:var(--tx)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--sf);padding:10px 18px;border-radius:12px;z-index:50;display:none;gap:10px;align-items:center;max-width:92%;box-shadow:var(--shadow-lg);flex-wrap:wrap;justify-content:center;font-weight:600}
#toast button{min-height:32px;padding:2px 12px;background:rgba(255,255,255,.15);color:inherit;border:0}
.empty{text-align:center;color:var(--mut);padding:32px 8px;font-size:14px}
.subtle{color:var(--mut);font-size:12px}
.field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.field2{grid-template-columns:1fr}}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media(max-width:879px){
  .app{display:block}
  #nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-inline-end:0;border-top:1px solid var(--bd);z-index:10;gap:0;overflow-x:auto}
  .brand,#nav .add{display:none}
  #nav .it{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:8px 0;min-width:0;justify-content:center;min-width:60px}
  #nav .it svg{width:22px;height:22px}
  main{padding-bottom:110px}
  #fab{display:inline-flex}
  h1{font-size:22px}
  .hero .big{font-size:30px}
  .pa .b span{display:none}
}
@media(min-width:880px){#m{align-items:center;padding:20px}.sh{border-radius:24px;max-height:88%}}
.pl{display:flex;align-items:center;gap:10px;min-width:0}
.mb{width:40px;padding:0;flex:none;min-height:40px}
.app.nh{grid-template-columns:1fr}
.app.nh #nav{display:none}
.app.nh main{padding-bottom:90px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--rad-sm);background:var(--sf);cursor:pointer;transition:all .15s}
.cat-item:hover{background:var(--s2);border-color:var(--bd2)}
.cat-item .ci-ic{font-size:20px}
.cat-item .ci-nm{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item .ci-act{display:flex;gap:2px;opacity:.6}
.cat-item:hover .ci-act{opacity:1}
.cat-item .ci-act button{min-height:28px;padding:2px 8px;font-size:12px;border:0;background:transparent}
.cur-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.cur-row:last-child{border:0}
.cur-row .cur-info{flex:1}
.cur-row .cur-code{font-weight:700;font-family:ui-monospace,monospace;color:var(--pri)}
.cur-row .cur-name{font-size:12px;color:var(--mut)}
.cur-row .cur-rate{font-size:13px;font-weight:600;color:var(--tx2)}
.cur-row .cur-actions{display:flex;gap:4px}
.cur-row .cur-actions button{min-height:32px;padding:4px 10px;font-size:12px}
/* بطاقات أهداف الادخار */
.goal{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow)}
.goal.done{border-color:var(--in);background:linear-gradient(180deg,var(--sf),var(--in-soft))}
.goal .gtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.goal .gtitle b{font-size:15px}
.goal .gtitle .acts2{display:flex;gap:4px}
.goal .gtitle .acts2 button{min-height:30px;padding:4px 10px;font-size:12px}
.goal .gmeta{font-size:12px;color:var(--mut);margin-bottom:10px}
.goal .gvals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.goal .gvals>div{background:var(--s2);border-radius:10px;padding:8px 10px}
.goal .gvals .k{font-size:11px}
.goal .gvals b{font-size:15px;display:block;margin-top:2px}
.goal .gvals .auto{font-size:10px;color:var(--pri);font-weight:700}
.goal .gbar{height:10px;border-radius:5px;background:var(--s3);overflow:hidden;margin-bottom:8px}
.goal .gbar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.goal .gfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.goal .gfoot .badge2{background:var(--pri-soft);color:var(--pri);padding:2px 8px;border-radius:99px;font-weight:700;font-size:11px}
.goal .gfoot .badge2.done{background:var(--in-soft);color:var(--in)}
/* إحصاء عام */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.stats>div{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stats .k{font-size:11px}
.stats .v{font-size:16px;font-weight:800;margin-top:2px}
/* زر رئيسي كبير */
.bigbtn{width:100%;min-height:52px;font-size:15px;font-weight:700;background:var(--pri);color:var(--on);border:0;border-radius:14px}
.bigbtn:hover{background:var(--pri2)}
.bigbtn .ar{font-size:18px;margin-inline-start:auto}
.quickbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.quickbtns button{min-height:48px;font-size:14px;font-weight:700;border-radius:14px}
</style>
</head>
<body>
<div class="app" id="app"><nav id="nav"></nav><main id="v"></main></div>
<button id="fab" class="p" data-a="tx" aria-label="إضافة حركة">＋ حركة</button>
<div id="m" role="dialog" aria-modal="true" aria-label="نافذة"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden data-ch="xf">
<input type="file" id="imp" accept=".json,application/json" hidden data-ch="imp">
<script>
'use strict';
/* ============================================================
   محفظتي v6.0 — المدخر يُقرأ مباشرة من إجمالي الادخار
   ============================================================ */

const KEY='wallet_v5', LEGACY_KEYS=['wallet_v4','wallet_v2'], BACKUP_KEY='wallet_v5_backup';
const API=['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json','https://latest.currency-api.pages.dev/v1/currencies/usd.json'];
const GOLD_API=['https://api.gold-api.com/price/XAU'];
const CUR={EGP:['الجنيه المصري','ج.م'],USD:['الدولار الأمريكي','$'],EUR:['اليورو','€'],GBP:['الجنيه الإسترليني','£'],SAR:['الريال السعودي','ر.س'],AED:['الدرهم الإماراتي','د.إ'],KWD:['الدينار الكويتي','د.ك'],QAR:['الريال القطري','ر.ق'],BHD:['الدينار البحريني','د.ب'],OMR:['الريال العُماني','ر.ع'],JOD:['الدينار الأردني','د.أ'],MAD:['الدرهم المغربي','د.م'],TRY:['الليرة التركية','₺'],CAD:['الدولار الكندي','C$'],AUD:['الدولار الأسترالي','A$'],CHF:['الفرنك السويسري','CHF'],JPY:['الين الياباني','¥'],CNY:['اليوان الصيني','CN¥'],INR:['الروبية الهندية','₹']};
const TY={bank:'حساب بنكي',cash:'كاش',save:'ادخار نقدي',gold:'ادخار ذهب'};
const TT={in:'إيراد',out:'مصروف',tr:'تحويل'};

const fresh=()=>({v:5,base:'USD',on:['USD'],theme:'auto',nh:0,gold:{c:'USD',p:0},upd:0,src:'لم يتم التحديث بعد',rates:{USD:1},accs:[],tx:[],bud:[],goals:[],cat:DEFAULT_CATS.map(c=>({...c})),lastCat:{in:'أخرى',out:'أخرى'}});

function migrate(o){
  if(!o||typeof o!=='object')return null;
  if(o.v===5&&Array.isArray(o.accs)&&Array.isArray(o.tx)){
    /* يحتفظ الإصدار الحالي بتخصيص مستقل للمدخرات لكل هدف */
    if(Array.isArray(o.goals))o.goals.forEach(g=>{if(g&&typeof g==='object'&&!(Number.isFinite(+g.saved)&&+g.saved>=0))g.saved=0});
    return o;
  }
  if(o.v||o.accs){
    const s=fresh();
    for(const k of ['base','on','theme','nh','gold','upd','src','rates','accs','tx','bud','goals','cat','lastCat'])
      if(o[k]!==undefined)s[k]=o[k];
    /* ترقية أهداف الادخار */
    if(Array.isArray(s.goals))s.goals=s.goals.map(g=>{
      if(!g||typeof g!=='object')return g;
      const out={id:g.id||uid(),name:g.name||'',cur:g.cur||s.base,target:+g.target||0,saved:Math.max(0,+g.saved||0),date:g.date||'',note:g.note||''};
      return out;
    });
    return s;
  }
  return null;
}
function norm(o){
  const s=Object.assign(fresh(),o||{});
  s.gold=s.gold&&typeof s.gold==='object'?s.gold:{c:'USD',p:0};
  s.rates=s.rates&&typeof s.rates==='object'?s.rates:{USD:1};s.rates.USD=1;
  if(!Array.isArray(s.cat))s.cat=DEFAULT_CATS.map(c=>({...c}));
  if(!Array.isArray(s.accs))s.accs=[];
  if(!Array.isArray(s.tx))s.tx=[];
  if(!Array.isArray(s.bud))s.bud=[];
  if(!Array.isArray(s.goals))s.goals=[];
  if(!s.lastCat||typeof s.lastCat!=='object')s.lastCat={in:'أخرى',out:'أخرى'};
  if(s.gold.c!=='USD'){const n=s.gold.p>0&&s.rates[s.gold.c]?s.gold.p/s.rates[s.gold.c]:0;s.gold={c:'USD',p:n}}
  s.accs.forEach(a=>{if(a.type==='gold'&&!Array.isArray(a.lots))a.lots=[]});
  s.bud.forEach(b=>{b.per=b.per||'m';b.cur=b.cur||s.base});
  s.goals.forEach(g=>{
    if(!g.id)g.id=uid();
    g.saved=Math.max(0,+g.saved||0);
    g.target=Math.max(0,+g.target||0);
  });
  return s;
}
function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY));if(o)return norm(migrate(o))}catch(e){}
  try{const b=JSON.parse(localStorage.getItem(BACKUP_KEY));if(b)return norm(migrate(b))}catch(e){}

    try{const o=JSON.parse(localStorage.getItem(k));if(o){const m=norm(migrate(o));safeSet(KEY,JSON.stringify(m));return m}}catch(e){}
  }
  return fresh();
}

  if(n>0){S.rates.USD=1;S.upd=Date.now();S.src=trusted?'currency-api (تحديث يومي)':'يدوي';save()}else S.rates=before;
  return n;

function applyGold(usdPerGram,trusted){
  if(!(usdPerGram>0)||!isFinite(usdPerGram))return 0;

}

  const cm=nowYm(),m=mt(cm),lq=sumB(liq().map(valB)),net=lq,tot=m.invalid?0:m.i+m.o,pi=tot?m.i/tot*100:50,dis=na()?' disabled':'';
  const bs=budSummary(cm);
  const budNet=bs.has?bs.rem:null;
  const afterSpend=afterSpendCalc(net,budNet);
  const negBud=budNet!=null&&budNet<0,negAfter=afterSpend!=null&&afterSpend<0;
  const budTip=bs.has?`الإجمالي ${mn(bs.T)} − المصروف ${mn(bs.sp)}`:'لا توجد ميزانية محددة';
  const afterTip=budNet==null?'حدد ميزانية لرؤية الرصيد المتوقع بعد الإنفاق':(budNet>=0?`الرصيد الحالي ${mn(net)} − المتبقي المخطط إنفاقه ${mn(budNet)}. قيمة تقديرية وليست رصيدًا فعليًا.`:`الرصيد الحالي ${mn(net)} − تجاوز الميزانية ${mn(-budNet)}. قيمة تقديرية وليست رصيدًا فعليًا.`);
  return ph('محفظتي')+warn()+(na()?`<div class="card" style="border-color:var(--pri)"><b>ابدأ بإضافة حساب</b><div class="k" style="margin:6px 0 10px">أضف حسابًا بنكيًا أو كاش.</div><button class="p" data-a="af">+ حساب</button></div>`:'')+`
<div class="card hero">
  <div class="hg">
    <div aria-label="إجمالي البنوك والكاش">
      <div class="l">إجمالي البنوك والكاش</div>
      <div class="v${net!=null&&net<0?' neg':''}">${mn(net)}</div>
      <div class="s">الرصيد الحالي المتاح</div>
    </div>
    <div aria-label="صافي الميزانية" title="${esc(budTip)}">
      <div class="l">المتبقي من الميزانية</div>
      <div class="v${negBud?' neg':''}">${budNet==null?'—':mn(budNet)}</div>
      <div class="s">${esc(budTip)}</div>
    </div>
    <div class="hl" aria-label="الصافي بعد الإنفاق" title="${esc(afterTip)}">
      <div class="l">${ico('check',12)} الرصيد المتوقع بعد الإنفاق</div>
      <div class="v${negAfter?' neg':''}">${afterSpend==null?'—':mn(afterSpend)}</div>
      <div class="s">${esc(afterTip)}</div><div class="k" style="margin-top:4px">تقديري وفق الميزانية، وليس رصيدًا فعليًا</div>
    </div>
  </div>
  <div style="height:6px;border-radius:4px;background:#ffffff40;overflow:hidden;margin:14px 0 12px"><i style="display:block;height:100%;width:${pi}%;background:#fde68a;border-radius:4px"></i></div>
  <div class="g2"><div><div class="k">إيرادات الشهر</div><div class="n">${mn(m.i)}</div></div><div><div class="k">مصروفات الشهر</div><div class="n">${mn(m.o)}</div></div></div>
</div>
<div class="quickbtns">
  <button class="p" data-a="tx" data-j="in"${dis}>＋ إيراد</button>
  <button class="d" data-a="tx" data-j="out"${dis}>－ مصروف</button>
  <button data-a="tx" data-j="tr"${dis}>⇄ تحويل</button>
  <button class="b" data-a="tab" data-i="tx">☰ كل الحركات</button>
</div>
${homeExtra()}<div class="card"><div class="row"><div><div class="k">إجمالي الادخار</div><div style="font-size:22px;font-weight:800">${mn(totalSavings())}</div></div><button class="b" data-a="tab" data-i="sav">تفاصيل</button></div><div class="subtle">يشمل حسابات الادخار النقدي والذهب.</div></div>
<div class="grid">
<div class="card"><div class="t"><b>الحسابات</b><button class="b" data-a="af">+ حساب</button></div>${liq().map(accRow).join('')||'<div class="empty">أضف حسابًا</div>'}</div>
<div class="card"><div class="t"><b>آخر الحركات</b><button class="b" data-a="tab" data-i="tx">الكل</button></div>${S.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(row).join('')||'<div class="empty">لا حركات</div>'}</div>
</div>`;
}

/* ===== الميزانية ===== */
function bud(){
  const m=mt(mon),bs=budSummary(mon);
  const T=bs.T,sp=bs.sp,rem=bs.rem;
  const lq=sumB(liq().map(valB));
  const afterSpend=afterSpendCalc(lq,rem);
  const afterTip=rem==null?'':(rem>=0?`الرصيد ${mn(lq)} − المتبقي ${mn(rem)}`:`الرصيد ${mn(lq)} (متجاوزة بـ ${mn(-rem)})`);
  return ph('الميزانية','<button class="p" data-a="bf">+ بند</button>')+mnav()+`<div class="card hero"><div class="l">إجمالي ميزانية ${mname(mon)}</div><div class="big">${mn(T)}</div><div class="g2"><div><div class="k">المصروف</div><div class="n">${mn(sp)}</div></div><div><div class="k">المتبقي من الميزانية</div><div class="n">${mn(rem)}</div></div></div>
<div class="subtle" style="color:#ffffffcc;margin-top:12px">الصافي بعد الإنفاق: <b style="color:#fff">${mn(afterSpend)}</b> — ${esc(afterTip)}</div></div>
<div class="grid">${S.bud.map(b=>{const sp2=m.c[b.cat]||0,L=toB(bm(b,mon),b.cur||S.base)||0,p=L?sp2/L*100:0,isDaily=b.per==='d';
 let label,remainingL;
 remainingL=L-sp2;label=isDaily?`يومية ${f(b.amt)} ${sy(b.cur||S.base)} · ${dleft(mon)} يوم متبقٍ`:'شهرية';
 return `<div class="card" style="cursor:pointer" role="button" tabindex="0" data-a="bf" data-i="${b.id}"><div class="row"><b>${ci(b.cat,'out')} ${esc(b.cat)}</b><span class="k">${label}</span></div>
<div class="row" style="margin-top:8px"><span class="k">${f(sp2)} / ${f(L)}</span><b class="${remainingL<0?'out':'in'}">متبقي ${f(remainingL)}</b></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>100?'var(--out)':p>80?'var(--warn)':'var(--pri)'}"></i></div></div>`}).join('')||'<div class="card empty" style="grid-column:1/-1">أضف بنود الميزانية</div>'}</div>`;
}

function stm(a){
  const td=iso(new Date()),ms=mon+'-01',me=mon+'-'+String(dim(mon)).padStart(2,'0'),E=[];let fut=0;
  S.tx.forEach((t,ix)=>{
    let d,ds;
    if(t.acc===a.id){if(t.type==='tr'){d=-t.av;ds='تحويل إلى '+an(t.to)}else{d=t.type==='in'?t.av:-t.av;ds=t.cat}}
    else if(t.type==='tr'&&t.to===a.id){d=t.amt2;ds='تحويل من '+an(t.acc)}else return;
    if(t.date>td){fut++;return}E.push({t,d,ds,ix});
  });
  E.sort((x,y)=>x.t.date.localeCompare(y.t.date)||x.ix-y.ix);
  let open=a.open||0,tin=0,tout=0;
  if(!sall)E.filter(e=>e.t.date<ms).forEach(e=>open+=e.d);
  let run=open;
  const per=E.filter(e=>sall||(e.t.date>=ms&&e.t.date<=me)).map(e=>{run+=e.d;e.d>0?tin+=e.d:tout-=e.d;return{...e,run}});
  return{per,open,end:run,tin,tout,fut};
}
function st(){
  const a=acc(sid);if(!a){tab='acc';return accs()}
  const s=stm(a);
  return ph('كشف حساب',`<button class="b" data-a="bk">رجوع</button><button class="b" data-a="x2">${ico('dn',18)}</button><button class="b" data-a="af" data-i="${a.id}">تعديل</button>`)+`<div class="card hero"><div class="l">${esc(a.name)} · ${TY[a.type]}</div><div class="big">${mn(bal(a),a.cur)}</div><div class="g2"><div><div class="k">بداية الفترة</div><div class="n">${mn(s.open,a.cur)}</div></div><div><div class="k">نهاية الفترة</div><div class="n">${mn(s.end,a.cur)}</div></div></div></div>
<div class="seg"><button class="${sall?'':'on'}" data-a="sm" data-i="0">شهر محدد</button><button class="${sall?'on':''}" data-a="sm" data-i="1">كل الفترة</button></div>${sall?'':mnav()}${two('واردات',[mn(s.tin,a.cur),mn(s.tout,a.cur),'out'],'in','صادرات')}
<div class="card">${s.per.map(e=>rowA('tx',e.t.id,[e.d>0?'in':'out',e.t.type==='tr'?'⇄':ci(e.t.cat,e.t.type),e.t.type==='tr'?'':cb(e.t.cat)+'22'],`<b>${esc(e.ds)}</b><small>${e.t.date}${e.t.note?' · '+esc(e.t.note):''}</small>`,`<div style="text-align:end"><b class="${e.d>0?'in':'out'}">${e.d>0?'+':'−'}${f(Math.abs(e.d))}</b><small class="k" style="display:block">الرصيد ${f(e.run)}</small></div>`)).join('')||'<div class="empty">لا حركات</div>'}</div>${s.fut?`<div class="k" style="text-align:center">${num(s.fut)} حركة مستقبلية</div>`:''}`;
}

function goldPage(){
  const a=acc(sid);if(!a){tab='sav';return sav()}
  const L=lots(a).slice().sort((x,y)=>x.d.localeCompare(y.d)),P0=S.gold.p||0,usd=v=>f(Math.round(v*100))+' $',cost=sum(L.map(l=>g24(l)*l.p)),val=sum(L.map(l=>g24(l)*P0)),w=sum(L.map(g24)),pl=val-cost,pp=cost?pl/cost*100:0;
  return ph('بيان الذهب',`<button class="b" data-a="bk">رجوع</button><button class="b" data-a="af" data-i="${a.id}">تعديل</button><button class="p" data-a="lf">+ شراء</button>`)+(P0?'':`<div class="card" style="border-color:var(--out)">حدّد سعر الذهب من الإعدادات.</div>`)+
`<div class="card hero"><div class="l">${esc(a.name)}</div><div class="big">${usd(val)}</div><div class="g2"><div><div class="k">التكلفة</div><div class="n">${usd(cost)}</div></div><div><div class="k">الربح/الخسارة</div><div class="n">${pl>=0?'+':'−'}${usd(Math.abs(pl))} · ${num(pp)}٪</div></div></div></div>
<div class="g2" style="margin-bottom:14px"><div class="card" style="margin:0"><div class="k">إجمالي الجرامات</div><div class="n">${num(gg(a))} جم</div></div><div class="card" style="margin:0"><div class="k">مكافئ عيار ٢٤</div><div class="n">${num(w)} جم</div></div><div class="card" style="margin:0"><div class="k">متوسط الشراء</div><div class="n">${w?usd(cost/w):'—'}</div></div><div class="card" style="margin:0"><div class="k">سعر اليوم</div><div class="n gold">${P0?usd(P0):'—'}</div></div></div>
<div class="card"><b>عمليات الشراء</b>${L.slice().reverse().map(l=>{const c=g24(l)*l.p,v=g24(l)*P0,d=v-c;return rowA('lf',l.id,['','🥇'],`<b>${num(l.g)} جم · عيار ${l.k}</b><small>${l.d} · ${usd(l.p)}/جم ٢٤</small>`,`<div style="text-align:end"><b>${usd(v)}</b><small class="${d>=0?'in':'out'}" style="display:block">${d>=0?'+':'−'}${usd(Math.abs(d))}</small></div>`)}).join('')||'<div class="empty">لا عمليات شراء</div>'}</div>`;
}

function txs(){
  const k=q.trim().toLowerCase(),L=S.tx.filter(t=>t.date.slice(0,7)===mon&&(fty==='all'||t.type===fty)&&(!k||[t.cat,t.note,an(t.acc),an(t.to)].join(' ').toLowerCase().includes(k))).sort((a,b)=>b.date.localeCompare(a.date)),m=mt(mon);let last='',h='';

  return ph('الحركات')+mnav()+two('إيرادات',[mn(m.i),mn(m.o),'out'],'in','مصروفات')+`<div class="seg">${[['all','الكل'],['in','إيراد'],['out','مصروف'],['tr','تحويل']].map(([a,b])=>`<button class="${fty===a?'on':''}" data-a="ft" data-i="${a}">${b}</button>`).join('')}</div>
<input placeholder="بحث…" value="${esc(q)}" data-ch="q" style="margin-bottom:12px"><div class="card">${h||'<div class="empty">لا حركات</div>'}</div>`;

  const L=liq(),old=S.accs.filter(a=>a.arch);

/* ===== صفحة الادخار: المدخر يُقرأ مباشرة ===== */
function sav(){
  const sv=act().filter(a=>a.type==='save'),gd=act().filter(a=>a.type==='gold');
  const cs=sumB(sv.map(valB)),gs=sumB(gd.map(valB));
  const tot=totalSavings();
  const td=iso(new Date());

  const goalCards=S.goals.map(g=>{
    const saved=goalSaved(g); // مباشر من إجمالي الادخار
    const target=g.target;
    const pct=(target>0&&saved!=null)?(saved/target*100):0;
    const remaining=Math.max(0,target-(saved||0));
    const done=saved!=null&&saved>=target&&target>0;
    const months=g.date?Math.max(1,(+g.date.slice(0,4)-+td.slice(0,4))*12+(+g.date.slice(5,7)-+td.slice(5,7))):null;
    const monthly=months&&remaining>0?Math.ceil(remaining/months):0;
    return `<div class="goal${done?' done':''}">
      <div class="gtitle"><b>${done?'✅ ':''}${esc(g.name)}</b><div class="acts2"><button class="p" data-a="goalAdd" data-i="${g.id}">＋ إيداع</button><button class="b" data-a="goalForm" data-i="${g.id}">تعديل</button><button class="d" data-a="goalDel" data-i="${g.id}">حذف</button></div></div>
      <div class="gmeta">${g.date?'الموعد: '+esc(g.date):'دون موعد'} · ${g.cur}${g.date&&g.date<td&&!done?' · ⏰ تجاوز الموعد':(months?` · ${months} شهر متبقٍ`:'')}</div>
      <div class="gvals">
        <div><div class="k">المبلغ المخصص</div><b>${saved==null?'—':mn(saved,g.cur)}</b></div>
        <div><div class="k">المستهدف</div><b>${mn(target,g.cur)}</b></div>
      </div>
      <div class="gbar"><i style="width:${Math.min(100,Math.max(0,pct))}%;background:${done?'var(--in)':'var(--pri)'}"></i></div>
      <div class="gfoot">
        <span>${num(pct)}٪</span>
        ${done?`<span class="badge2 done">🎉 هدف مكتمل</span>`:(remaining>0?`<span>متبقٍ ${mn(remaining,g.cur)}</span>`:'<span class="badge2">—</span>')}
      </div>
      ${monthly>0?`<div class="gmeta" style="margin-top:8px;margin-bottom:0">ادخار شهري مطلوب: <b style="color:var(--tx)">${mn(monthly,g.cur)}</b></div>`:''}
      ${g.note?`<div class="gmeta" style="margin-top:6px;margin-bottom:0">📝 ${esc(g.note)}</div>`:''}
    </div>`;
  }).join('');

  /* ملخص الأهداف */
  const totalTargets=sumB(S.goals.map(g=>cv(g.target,g.cur,S.base)));
  const lqS=sumB(liq().map(valB)),totalAllocated=(lqS==null||tot==null)?null:lqS+tot;
  const totalNeeded=totalTargets==null||totalAllocated==null?null:Math.max(0,totalTargets-totalAllocated);
  const overallPct=totalTargets>0&&totalAllocated!=null?Math.min(100,(totalAllocated/totalTargets)*100):0;

  return ph('الادخار','<button class="p" data-a="goalForm">+ هدف ادخار</button>')+
`<div class="card hero"><div class="l">إجمالي المدخرات</div><div class="big">${mn(tot)}</div><div class="g2"><div><div class="k">ادخار نقدي</div><div class="n">${mn(cs)}</div></div><div><div class="k">ذهب (${num(sum(gd.map(gg)))} جم)</div><div class="n">${mn(gs)}</div></div></div></div>
${S.goals.length?`<div class="card">
  <div class="t"><b>تقدّم الأهداف الإجمالي</b></div>
  <div class="row"><span class="k">إجمالي المستهدف: ${mn(totalTargets)}</span><span class="k">${num(overallPct)}٪</span></div>
  <div class="bar"><i style="width:${overallPct}%;background:${overallPct>=100?'var(--in)':'var(--pri)'}"></i></div>
  <div class="stats">
    <div><div class="k">المدخر الآن (سيولة + ادخار)</div><div class="v in">${totalAllocated==null?'—':mn(totalAllocated)}</div></div>
    <div><div class="k">المطلوب للاكتمال</div><div class="v ${totalNeeded>0?'':'in'}">${totalNeeded==null?'—':totalNeeded>0?mn(totalNeeded):'مكتمل'}</div></div>
    <div><div class="k">عدد الأهداف</div><div class="v">${num(S.goals.length)}</div></div>
  </div>
</div>`:''}
<div class="card"><div class="t"><b>🎯 أهداف الادخار</b><button class="b" data-a="goalForm">+ هدف</button></div><div class="subtle">يُسجّل لكل هدف المبلغ المخصص له بعملته؛ تجنّب تخصيص المبلغ نفسه لأكثر من هدف.</div><div class="grid" style="margin-top:12px">${goalCards||'<div class="empty" style="grid-column:1/-1">أضف هدفًا مثل صندوق الطوارئ أو السفر.</div>'}</div></div>
<div class="grid">
<div class="card"><div class="t"><b>ادخار نقدي</b><button class="b" data-a="af" data-j="save">+ إضافة</button></div>${sv.map(accRow).join('')||'<div class="empty">لا حسابات ادخار نقدي</div>'}</div>
<div class="card"><div class="t"><b>ذهب</b><button class="b" data-a="af" data-j="gold">+ إضافة</button></div>${gd.map(accRow).join('')||'<div class="empty">لا حسابات ذهب</div>'}<div class="k" style="margin-top:8px">السعر: ${S.gold.p?num(S.gold.p)+' '+sy(S.gold.c)+'/جم ٢٤':'غير محدد'}.</div></div>
</div>`;
}

function rep(){

  const mm=[5,4,3,2,1,0].map(i=>{const x=shift(mon,-i);return[x,mt(x)]}),mx2=Math.max(1,...mm.map(x=>Math.max(x[1].i||0,x[1].o||0))),nt=m.invalid?null:m.i-m.o;
  const top=S.tx.filter(t=>t.date.slice(0,7)===mon&&t.type==='out').sort((a,b)=>(toB(b.amt,b.cur)||0)-(toB(a.amt,a.cur)||0)).slice(0,5);
  return ph('التقارير')+mnav()+two('إيرادات',[mn(m.i),mn(m.o),'out'],'in','مصروفات')+`<div class="grid">
<div class="card"><div class="k">صافي الشهر</div><div class="n ${nt<0?'out':'in'}" style="font-size:26px">${mn(nt)}</div><div class="k" style="margin-top:6px">${m.i?'ادخار: '+num(nt/m.i*100)+'٪':'لا إيرادات'}</div></div>
<div class="card"><b>حسب التصنيف</b>${cs.length?`<div class="dn" style="margin-top:10px">${donut(cs,m.o)}<ul>${cs.map(([k,v],i)=>`<li><span><i style="background:${COL[i%8]}"></i>${ci(k,'out')} ${esc(k)}</span><b>${num(v/m.o*100)}٪</b></li>`).join('')}</ul></div>`:'<div class="empty">لا مصروفات</div>'}</div>
<div class="card"><b>المصروف اليومي</b><div class="days">${Array.from({length:dm},(_,i)=>{const v=m.d[i+1]||0;return `<b style="height:${v/mx*100}%"></b>`}).join('')}</div></div>
<div class="card"><b>آخر ٦ أشهر</b><div class="days" style="height:130px">${mm.map(([x,d])=>`<div class="pair"><b style="height:${(d.i||0)/mx2*100}%;background:var(--in)"></b><b style="height:${(d.o||0)/mx2*100}%;background:var(--out)"></b></div>`).join('')}</div>
<div class="days" style="height:auto;margin-top:4px">${mm.map(([x])=>`<span class="k" style="flex:1;text-align:center">${new Date(x+'-15').toLocaleDateString('ar',{month:'short'})}</span>`).join('')}</div></div>
<div class="card"><b>أكبر المصروفات</b>${top.map(row).join('')||'<div class="empty">لا مصروفات</div>'}</div></div>`;
}

/* ===== الإعدادات ===== */
function setx(){

function plan(w,mode){

      const seen=new Set(T.tx.map(kx));

}

A.qaRun=()=>{
  const inp=$('#qa');if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  const m=v.match(/^([\d٠-٩٫.]+)\s*(.*)$/);
  if(!m)return toast('الصيغة: «50 قهوة»');
  const amt=P(dig(m[1])),rest=(m[2]||'').trim();
  const accounts=act().filter(a=>a.type!=='gold');if(!accounts.length)return toast('أضف حسابًا');
  const a=accounts[0],isIn=/راتب|إيراد|دخل/.test(rest),type=isIn?'in':'out';
  const match=S.cat.find(c=>c.t===type&&c.n===rest);
  const catName=match?match.n:(rest||S.lastCat[type]||'أخرى');
  S.tx.push({id:uid(),type,amt,cur:a.cur,av:amt,acc:a.id,to:'',amt2:0,cat:catName,date:iso(new Date()),note:''});
  S.lastCat[type]=catName;
  save();invalidateBalances();R();toast('تم: '+mn(amt,a.cur)+' · '+catName);
};
